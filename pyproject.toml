[project]
name = "localmind"
version = "0.9.1"
description = "Autonomous task worker for local intelligence"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Pragmatic ignore list: years of accumulated style debt in tests/ and
# integration code. We gate on REAL bugs (F-rules, real syntax), not on
# whitespace/line-length. Tighten incrementally over time.
extend-ignore = [
    "E501",  # line-too-long
    "E402",  # module-import-not-at-top (lazy/circular-import patterns)
    "E701",  # multiple-statements-on-one-line-colon (common in tests)
    "E702",  # multiple-statements-on-one-line-semicolon
    "E741",  # ambiguous-variable-name (l, I, O sometimes intentional)
    "E712",  # true-false-comparison
    "E721",  # type-comparison
    "E722",  # bare-except (legacy code)
    "W291",  # trailing-whitespace
    "W292",  # no-newline-at-end-of-file
    "W293",  # blank-line-with-whitespace
    "F541",  # f-string without placeholders
    "F401",  # unused-import (re-exports in __init__.py)
    "F841",  # unused-variable (often intentional in tests)
    "I001",  # import-block-unsorted: legacy debt, run `ruff check --fix` to clean up
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F811", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "strict"
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that need external services (Ollama, etc.)",
    "unit: marks pure unit tests with no external dependencies",
]
