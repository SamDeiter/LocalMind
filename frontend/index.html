<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Nexus | Autonomous Command Interface</title>

    <!-- Tailwind & Fonts -->
    <link rel="stylesheet" href="dist/output.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="manifest" href="manifest.json" />

    <!-- Monaco & Highlight.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css" />
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

    <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-[#020617] text-slate-300 font-body selection:bg-indigo-500/30 overflow-hidden h-screen flex">
<div class="app-container w-full h-full flex overflow-hidden">

    <!-- Mount Point: Sidebar -->
    <div id="app-sidebar-mount" class="flex-shrink-0 h-full"></div>

    <div class="main-content flex-1 h-screen flex flex-col relative bg-[radial-gradient(ellipse_at_top,_#0f172a80,_#020617_70%)]">
        <!-- TopNavBar (Static for now as it's small) -->
        <header class="h-16 z-40 bg-slate-950/60 backdrop-blur-md border-b border-slate-800/60 flex items-center justify-between px-8 flex-shrink-0">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-2">
                    <span id="brainPulse" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_10px_#10b981]"></span>
                    <span id="brainStatus" class="text-[10px] font-black uppercase tracking-[0.15em] text-slate-400">Core Active</span>
                </div>
                <div class="hidden lg:flex items-center gap-6">
                    <span class="text-primary font-mono text-[10px] tracking-widest uppercase border border-primary/20 bg-primary/5 px-2 py-0.5 rounded-full" id="tokenCounter">0 / 16384 TX</span>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <!-- System Status Indicators -->
                <div class="flex items-center gap-3">
                    <div class="flex flex-col gap-1 p-2.5 px-4 rounded-xl bg-slate-900/40 border border-slate-800/60 min-w-[100px]">
                        <div class="flex items-center gap-2 text-[9px] uppercase tracking-wider font-bold text-slate-500">
                            <span class="material-symbols-outlined text-cyan-400 text-[12px]">memory</span> CPU
                        </div>
                        <div class="text-xs font-bold text-slate-100 tabular-nums font-mono" id="cpuVal">--%</div>
                    </div>
                    <div class="flex flex-col gap-1 p-2.5 px-4 rounded-xl bg-slate-900/40 border border-slate-800/60 min-w-[100px]">
                        <div class="flex items-center gap-2 text-[9px] uppercase tracking-wider font-bold text-slate-500">
                            <span class="material-symbols-outlined text-violet-400 text-[12px]">storage</span> VRAM
                        </div>
                        <div class="text-xs font-bold text-slate-100 tabular-nums font-mono" id="vramVal">--</div>
                    </div>
                    <div class="flex flex-col gap-1 p-2.5 px-4 rounded-xl bg-slate-900/40 border border-slate-800/60 min-w-[100px]">
                        <div class="flex items-center gap-2 text-[9px] uppercase tracking-wider font-bold text-slate-500">
                            <span class="material-symbols-outlined text-indigo-400 text-[12px]">monitoring</span> RAM
                        </div>
                        <div class="text-xs font-bold text-slate-100 tabular-nums font-mono" id="ramVal">--</div>
                    </div>
                </div>
                
                <div class="flex items-center gap-4 text-slate-400">
                    <span class="material-symbols-outlined cursor-pointer hover:text-primary transition-colors">notifications_active</span>
                </div>
            </div>
        </header>

        <!-- Mount Point: Editor Panel -->
        <div id="app-editor-mount" class="absolute inset-0 pt-16 z-[60] pointer-events-none"></div>

        <div class="flex-1 flex h-full overflow-hidden" id="mainDashboardView">
             <!-- Mount Point: Middle Pane -->
             <div id="app-main-mount" class="flex-1 flex flex-col h-full overflow-hidden"></div>
             <!-- Mount Point: Right Info Pane -->
             <div id="app-right-mount" class="h-full flex flex-col"></div>
        </div>
    </div>
</div>

<!-- Mount Point: Modal -->
<div id="app-modal-mount"></div>

<!-- Hidden compatibility layer -->
<div class="hidden" aria-hidden="true">
    <textarea id="systemPromptText"></textarea>
    <div id="systemPromptEditor"></div>
    <button id="saveSystemPrompt"></button>
    <select id="modelSelect">
        <option value="auto">Auto</option>
        <option value="fast">Fast</option>
        <option value="deep">Deep</option>
    </select>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
