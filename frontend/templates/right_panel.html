<section class="w-80 flex-shrink-0 bg-[#030712] border-l border-slate-800/60 flex flex-col p-6 overflow-y-auto custom-scrollbar z-10">
                
                <!-- Decision Support / Architect Insight -->
                <div class="mb-8">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-200">Architect Insight</h2>

                    </div>
                </div>

                <!-- Research Intelligence (ArXiv Search) -->
                <div class="mb-8">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-200 flex items-center gap-2.5">Research Network</h2>
                        <span class="material-symbols-outlined text-sm text-secondary">history_edu</span>
                    </div>
                    <div class="space-y-4">
                        <div class="flex gap-2">
                            <input id="arxivSearchInput" class="flex-1 bg-surface-container-low border border-outline-variant/20 rounded-lg py-1.5 px-3 text-xs font-medium focus:ring-1 focus:ring-primary focus:outline-none placeholder:text-outline transition-all" placeholder="Query ArXiv..." type="text"/>

                        <div id="arxivResults" class="space-y-3 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar">

                                <span class="material-symbols-outlined text-3xl opacity-20">description</span>
                                <p class="text-[9px] uppercase tracking-widest font-bold">Input Query to Index Papers</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- System Logs (Replacing visual charts with the Operations Log) -->

                    </div>
                    <div class="flex-1 space-y-5 overflow-y-auto pr-2 custom-scrollbar" id="systemLogFeed">

                                <div class="flex justify-between items-center mb-1">

                                </div>
                                <p class="text-[11px] text-on-surface-variant leading-tight">Semantic index reconstruction complete.</p>
                            </div>
                        </div>
                        <div class="group flex gap-3">
                            <div class="w-1 h-8 bg-primary rounded-full mt-1"></div>
