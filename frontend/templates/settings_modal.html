<div id="settingsModal" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/80 backdrop-blur-sm p-4">
    <div class="glass-panel w-full max-w-lg rounded-2xl border border-outline-variant/30 shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
        <div class="p-6 border-b border-outline-variant/20 flex items-center justify-between bg-surface-container-low">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-primary">notifications_active</span>
                <h2 class="font-headline font-bold text-xl tracking-tight text-on-background">Notification Settings</h2>
            </div>
            <button id="closeSettingsBtn" class="text-outline hover:text-error transition-colors p-2 rounded-full hover:bg-white/5">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-8 space-y-8 custom-scrollbar">
            <!-- SMS Section -->
            <div class="space-y-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-sm tracking-widest uppercase text-primary">SMS Integration (Twilio)</h3>
                        <p class="text-[11px] text-outline mt-1">Configure your Twilio account to receive alerts.</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="smsEnabled" class="sr-only peer">
                        <div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
                    </label>
                </div>

                <div class="grid grid-cols-1 gap-5">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-outline ml-1">Account SID</label>
                        <input type="text" id="twilioSid" title="Twilio Account SID" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all placeholder:text-outline/30" placeholder="ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-outline ml-1">Auth Token</label>
                        <input type="password" id="twilioToken" title="Twilio Auth Token" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all placeholder:text-outline/30" placeholder="••••••••••••••••••••••••••••••••">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold uppercase tracking-widest text-outline ml-1">Twilio Number</label>
                            <input type="text" id="twilioPhone" title="Twilio Phone Number" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all placeholder:text-outline/30" placeholder="+15550000000">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold uppercase tracking-widest text-outline ml-1">Your Phone Number</label>
                            <input type="text" id="targetPhone" title="Target Phone Number" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all placeholder:text-outline/30" placeholder="+15559998888">
                        </div>
                    </div>
                </div>
            </div>


            <!-- Cloud Intelligence Section -->
            <div class="pt-6 border-t border-outline-variant/15">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h3 class="font-bold text-sm tracking-widest uppercase text-primary">Cloud Intelligence (Gemini)</h3>
                        <p class="text-[11px] text-outline mt-1">Enable complex reasoning with Google Gemini.</p>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-outline ml-1">Gemini API Key</label>
                        <div class="relative">
                            <input type="password" id="geminiKey" title="Gemini API Key" class="w-full bg-surface-container-low border border-outline-variant/30 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all placeholder:text-outline/30" placeholder="AIzaSy...">
                            <a href="https://aistudio.google.com/apikey" target="_blank" class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-primary hover:underline font-bold">Get Key</a>
                        </div>
                    </div>
                    <button id="testGeminiBtn" class="w-full py-2 bg-surface-variant/50 hover:bg-surface-variant text-[10px] font-bold rounded-lg uppercase tracking-widest transition-all border border-outline-variant/20 flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-xs">analytics</span> Verify Connection
                    </button>
                </div>
            </div>

        </div>

        <div class="p-6 border-t border-outline-variant/20 bg-surface-container-low flex justify-between gap-4">
            <button id="testSmsBtn" class="px-6 py-2.5 bg-surface-variant hover:bg-surface-bright text-on-surface text-xs font-bold rounded-xl uppercase tracking-widest transition-all border border-outline-variant/30 flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">send</span> Test Alert
            </button>
            <button id="saveSettingsBtn" class="px-8 py-2.5 primary-gradient text-on-primary text-xs font-bold rounded-xl uppercase tracking-widest shadow-lg shadow-primary/20 hover:brightness-110 active:scale-95 transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">save</span> Save Config
            </button>
        </div>
    </div>
</div>
