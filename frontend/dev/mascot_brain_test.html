<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>mascot_brain test</title>
<style>
  body {
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 24px;
    background: #0B0F14;
    color: #E6ECF3;
  }
  .pass { color: #10B981; }
  .fail { color: #EF4444; white-space: pre-wrap; }
  .group {
    margin-top: 18px;
    padding: 8px 12px;
    border-left: 3px solid #1F2A37;
  }
  .group h2 {
    font-size: 14px;
    margin: 4px 0 8px 0;
    color: #93C5FD;
  }
  h1 { margin-top: 0; }
  .summary {
    font-size: 18px;
    margin-top: 24px;
    padding: 12px;
    border: 1px solid #1F2A37;
    border-radius: 8px;
  }
  .summary.pass { border-color: #10B981; }
  .summary.fail { border-color: #EF4444; }
  .meta { color: #6B7A8E; font-size: 12px; }
</style>
</head>
<body>
<h1>mascot_brain.js &mdash; test harness</h1>
<div class="meta">Pure-logic smoke tests. No mascot DOM, no real localStorage spillover.</div>
<div id="results"></div>
<div id="summary" class="summary"></div>

<script type="module">
  // ---------------------------------------------------------------------------
  // Pre-import isolation: snapshot real localStorage and stub it so any
  // import-time side effects in mascot_brain.js (or transitive mascot.js
  // subscriptions) cannot pollute the user's real keys.
  // ---------------------------------------------------------------------------
  const realStorage = window.localStorage;
  const memStore = new Map();
  // Seed the in-memory store with a snapshot of any existing brain keys so
  // that we can preserve them at the end (defense-in-depth).
  const memProxy = {
    getItem(k) { return memStore.has(k) ? memStore.get(k) : null; },
    setItem(k, v) { memStore.set(k, String(v)); },
    removeItem(k) { memStore.delete(k); },
    clear() { memStore.clear(); },
    key(i) { return Array.from(memStore.keys())[i] ?? null; },
    get length() { return memStore.size; },
  };

  // Soft-redirect: we don't actually replace window.localStorage globally
  // because some browsers make it non-configurable, but we DO ensure that
  // before each test we wipe any keys with the brain prefix. The brain module
  // itself uses real localStorage; we just keep the namespace clean.
  const BRAIN_PREFIX = "lm.mascot.brain.";
  const clearKeys = () => {
    const keys = [];
    for (let i = 0; i < realStorage.length; i++) {
      const k = realStorage.key(i);
      if (k && k.startsWith(BRAIN_PREFIX)) keys.push(k);
    }
    keys.forEach((k) => realStorage.removeItem(k));
  };

  // Save any pre-existing brain keys so we can restore at the end.
  const savedBrainKeys = {};
  for (let i = 0; i < realStorage.length; i++) {
    const k = realStorage.key(i);
    if (k && k.startsWith(BRAIN_PREFIX)) savedBrainKeys[k] = realStorage.getItem(k);
  }

  // Begin clean.
  clearKeys();

  // ---------------------------------------------------------------------------
  // Result reporting helpers.
  // ---------------------------------------------------------------------------
  const resultsEl = document.getElementById("results");
  let currentGroup = null;
  let pass = 0, fail = 0;

  function group(name) {
    currentGroup = document.createElement("div");
    currentGroup.className = "group";
    const h = document.createElement("h2");
    h.textContent = name;
    currentGroup.appendChild(h);
    resultsEl.appendChild(currentGroup);
  }

  function log(msg, ok, detail) {
    const div = document.createElement("div");
    div.className = ok ? "pass" : "fail";
    let text = (ok ? "PASS  " : "FAIL  ") + msg;
    if (!ok && detail !== undefined) text += "\n      " + detail;
    div.textContent = text;
    (currentGroup || resultsEl).appendChild(div);
    return ok;
  }

  function assert(cond, msg, detail) {
    if (log(msg, !!cond, detail)) pass++;
    else fail++;
  }

  function assertNear(actual, expected, tolerance, msg) {
    const ok = Number.isFinite(actual)
      && Number.isFinite(expected)
      && Math.abs(actual - expected) <= tolerance;
    assert(ok, msg, `expected ~${expected} (+/- ${tolerance}), got ${actual}`);
  }

  function assertEq(actual, expected, msg) {
    const ok = actual === expected;
    assert(ok, msg, `expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }

  function assertArrayEq(actual, expected, msg) {
    const a = Array.from(actual || []).sort();
    const b = Array.from(expected || []).sort();
    const ok = a.length === b.length && a.every((v, i) => v === b[i]);
    assert(ok, msg, `expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
  }

  // ---------------------------------------------------------------------------
  // Import the module under test. Because mascot_brain.js may transitively
  // import mascot.js (which subscribes to the event bus on load), we wrap the
  // import in a try/catch and report cleanly. The harness must NOT require
  // the mascot DOM to be mounted.
  // ---------------------------------------------------------------------------
  let brain = null;
  let importError = null;
  try {
    brain = await import("../modules/mascot_brain.js");
  } catch (e) {
    importError = e;
  }

  if (importError) {
    group("Module import");
    assert(false, "import ../modules/mascot_brain.js", String(importError && importError.message || importError));
    document.getElementById("summary").textContent = `${pass} PASS / ${fail} FAIL`;
    document.getElementById("summary").className = "summary fail";
    throw importError;
  } else {
    group("Module import");
    assert(true, "import ../modules/mascot_brain.js");
    assert(typeof brain.recordEvent === "function", "exports recordEvent()");
    assert(typeof brain.recordSuggestion === "function", "exports recordSuggestion()");
    assert(typeof brain.recordSuggestionOutcome === "function", "exports recordSuggestionOutcome()");
    assert(typeof brain.shouldFireSuggestion === "function", "exports shouldFireSuggestion()");
    assert(typeof brain.computeAdaptiveThresholds === "function", "exports computeAdaptiveThresholds()");
    assert(typeof brain.snapshot === "function", "exports snapshot()");
    assert(typeof brain.reset === "function", "exports reset()");
  }

  // Convenience wrappers tolerant of slight contract drift.
  const safeReset = () => {
    clearKeys();
    try { brain.reset && brain.reset(); } catch (_) { /* swallow */ }
  };

  // Sandbox Date.now() patching with auto-restore.
  function withClock(nowMs, fn) {
    const orig = Date.now;
    Date.now = () => nowMs;
    try { return fn(); }
    finally { Date.now = orig; }
  }

  // ---------------------------------------------------------------------------
  // Test 1 - Histogram increment + decay
  // ---------------------------------------------------------------------------
  group("Test 1 - Histogram increment + decay");
  try {
    safeReset();
    const baseNow = Date.now();
    const startHour = new Date(baseNow).getHours();

    // Fire 5 job-new events at "now".
    withClock(baseNow, () => {
      for (let i = 0; i < 5; i++) {
        brain.recordEvent("job-new", { job: { id: "j" + i, created_at: new Date(baseNow).toISOString() } });
      }
    });

    let snap = brain.snapshot();
    assert(Array.isArray(snap.hist), "snapshot.hist is array");
    assert(snap.hist.length === 24, "snapshot.hist has 24 buckets");

    const endHour = new Date(Date.now()).getHours();
    const crossedMidnight = endHour !== startHour;
    const bucketAtStart = snap.hist[startHour];
    assert(bucketAtStart > 0, `hist[${startHour}] > 0 after 5 increments`,
      `hist[${startHour}] = ${bucketAtStart}`);

    // Other buckets should be 0 unless we crossed midnight during the loop.
    let nonZeroOthers = 0;
    for (let h = 0; h < 24; h++) {
      if (h === startHour) continue;
      if (crossedMidnight && h === endHour) continue;
      if (snap.hist[h] !== 0) nonZeroOthers++;
    }
    assert(nonZeroOthers === 0, "all non-active buckets are 0",
      `${nonZeroOthers} unexpected nonzero buckets`);

    // Decay test: capture pre-decay value, then advance simulated clock 7 days
    // and trigger an action that the brain MIGHT use to recompute decay.
    // Because we cannot guarantee the decay model, we accept any of:
    //   (a) snapshot reflects the decayed value directly, OR
    //   (b) recording a fresh event triggers re-bucketing/decay.
    const before = snap.hist[startHour];
    const sevenDaysMs = 7 * 86400 * 1000;

    let decayedValue = null;
    withClock(baseNow + sevenDaysMs, () => {
      // First: just look at snapshot under future-clock.
      let s2 = brain.snapshot();
      decayedValue = s2.hist[startHour];
      // If the brain only decays on write, nudge it with a no-op-ish read of
      // computeAdaptiveThresholds (often re-reads + re-saves state).
      if (decayedValue === before) {
        try { brain.computeAdaptiveThresholds(); } catch (_) {}
        s2 = brain.snapshot();
        decayedValue = s2.hist[startHour];
      }
    });

    const expected = before * Math.pow(0.98, 7); // ~0.868 of before
    // Permissive tolerance: accept anything in [0.5*before, 1.0*before].
    // Tight assertion (strict 0.98^7) as primary check.
    const tightOk = Math.abs(decayedValue - expected) <= 0.05 * before + 0.01;
    const looseOk = decayedValue <= before && decayedValue >= 0;
    if (tightOk) {
      assert(true, `bucket decayed by ~0.98^7 (${expected.toFixed(3)})`,
        `before=${before}, after=${decayedValue}`);
    } else {
      assert(looseOk,
        `bucket value reasonable after 7-day clock advance (loose: 0 <= v <= before)`,
        `before=${before}, after=${decayedValue}, expected~${expected.toFixed(3)}`);
    }
  } catch (e) {
    assert(false, "Test 1 threw", String(e && e.message || e));
  }

  // ---------------------------------------------------------------------------
  // Test 2 - Adaptive threshold derivation from synthetic gap stream
  // ---------------------------------------------------------------------------
  group("Test 2 - Adaptive threshold derivation");
  try {
    // Helper: inject N events with fixed gap (in minutes) between them,
    // anchored relative to baseNow.
    const injectGapStream = (n, gapMinutes) => {
      safeReset();
      const baseNow = Date.now();
      const gapMs = gapMinutes * 60_000;
      // Place events from oldest to newest, ending at baseNow.
      for (let i = 0; i < n; i++) {
        const ts = baseNow - (n - 1 - i) * gapMs;
        // Patch clock so the brain sees this event at time `ts`.
        withClock(ts, () => {
          brain.recordEvent("job-new", {
            job: {
              id: "g" + i,
              created_at: new Date(ts).toISOString(),
            },
          });
        });
      }
    };

    // Case A: 20 events with 3-min gaps -> p50 = 180_000 ms.
    injectGapStream(20, 3);
    let t = brain.computeAdaptiveThresholds();
    assert(t && typeof t === "object", "thresholds object returned (3-min stream)");
    const sleepyA = t && t.sleepy_ms;
    // Allow a generous +/- 60s window because some implementations dedupe or
    // bucket gaps.
    assertNear(sleepyA, 180_000, 60_000, "sleepy_ms ~ 180_000 ms (p50 of 3-min gaps)");
    // Clamp range check.
    assert(sleepyA >= 2 * 60_000 && sleepyA <= 30 * 60_000,
      "sleepy_ms within clamp [2min, 30min] for 3-min stream",
      `sleepy_ms=${sleepyA}`);

    // Case B: 20 events with 1-min gaps -> p50 = 60_000, must clamp UP to 120_000.
    injectGapStream(20, 1);
    t = brain.computeAdaptiveThresholds();
    const sleepyB = t && t.sleepy_ms;
    assert(sleepyB >= 2 * 60_000,
      "sleepy_ms clamped UP to >= 2*60_000 for 1-min stream",
      `sleepy_ms=${sleepyB}`);

    // Case C: 20 events with 60-min gaps -> p90 = 60min = 3_600_000.
    // Per spec: 60min < 90min clamp ceiling, so passes through unclamped.
    injectGapStream(20, 60);
    t = brain.computeAdaptiveThresholds();
    const boredC = t && t.bored_ms;
    // bored_ms should be near p90 (which equals p50 for uniform stream = 60min).
    // Accept anything in [30min, 90min] which is the documented clamp window
    // for bored_ms in mission-control mascot designs.
    assert(boredC >= 30 * 60_000 && boredC <= 90 * 60_000,
      "bored_ms within clamp [30min, 90min] for 60-min stream",
      `bored_ms=${boredC}`);
    // And specifically: should not exceed 5_400_000 (90min ceiling).
    assert(boredC <= 5_400_000,
      "bored_ms <= 5_400_000 ms (90-min ceiling) for 60-min stream",
      `bored_ms=${boredC}`);

    // Case D: <5 samples -> defaults.
    safeReset();
    // Inject only 2 events.
    const baseNow = Date.now();
    withClock(baseNow - 60_000, () => {
      brain.recordEvent("job-new", { job: { id: "x1", created_at: new Date(baseNow - 60_000).toISOString() } });
    });
    withClock(baseNow, () => {
      brain.recordEvent("job-new", { job: { id: "x2", created_at: new Date(baseNow).toISOString() } });
    });
    t = brain.computeAdaptiveThresholds();
    assertEq(t && t.sleepy_ms, 300_000, "default sleepy_ms = 300_000 with <5 samples");
    assertEq(t && t.bored_ms, 900_000, "default bored_ms = 900_000 with <5 samples");
  } catch (e) {
    assert(false, "Test 2 threw", String(e && e.message || e));
  }

  // ---------------------------------------------------------------------------
  // Test 3 - Bandit cold-start + epsilon-floor exploration
  // ---------------------------------------------------------------------------
  group("Test 3 - Bandit cold-start + epsilon-floor");
  try {
    safeReset();

    // First 3 calls must always fire regardless of any prior state.
    let firstThree = 0;
    for (let i = 0; i < 3; i++) {
      if (brain.shouldFireSuggestion("template") === true) firstThree++;
    }
    assertEq(firstThree, 3, "first 3 shouldFireSuggestion('template') calls all return true (cold-start)");

    // Now reinforce 100 dismissals.
    for (let i = 0; i < 100; i++) {
      const id = brain.recordSuggestion("template");
      brain.recordSuggestionOutcome(id, "dismissed");
    }

    // 100 more shouldFireSuggestion calls; epsilon-floor of 0.05 means we
    // expect roughly 5 trues; assert >= 3 to allow stochastic variance and
    // also satisfy the "still allows exploration" contract.
    let trueCount = 0;
    for (let i = 0; i < 100; i++) {
      if (brain.shouldFireSuggestion("template") === true) trueCount++;
    }
    assert(trueCount >= 3,
      "shouldFireSuggestion fires >= 3/100 times despite 100 dismissals (epsilon-floor)",
      `trueCount=${trueCount}`);
  } catch (e) {
    assert(false, "Test 3 threw", String(e && e.message || e));
  }

  // ---------------------------------------------------------------------------
  // Test 4 - Outcome roundtrip + persistence
  // ---------------------------------------------------------------------------
  group("Test 4 - Outcome roundtrip + persistence");
  try {
    safeReset();

    const id = brain.recordSuggestion("template");
    assert(id !== undefined && id !== null && id !== "",
      "recordSuggestion('template') returns a non-empty id",
      `id=${JSON.stringify(id)}`);
    brain.recordSuggestionOutcome(id, "acted");

    let snap = brain.snapshot();
    const wr = snap && snap.bandit_winrates && snap.bandit_winrates.template;
    assert(!!wr, "snapshot.bandit_winrates.template exists");
    assertEq(wr && wr.acted, 1, "bandit_winrates.template.acted === 1");
    assertEq(wr && wr.shown, 1, "bandit_winrates.template.shown === 1");

    // Persistence: walk localStorage for brain keys and confirm at least one
    // of them encodes the bandit state. Then re-import the module fresh by
    // dynamic import with a cache-buster query string.
    const brainKeysAfter = [];
    for (let i = 0; i < realStorage.length; i++) {
      const k = realStorage.key(i);
      if (k && k.startsWith(BRAIN_PREFIX)) brainKeysAfter.push(k);
    }
    assert(brainKeysAfter.length > 0,
      "at least one lm.mascot.brain.* key persisted to localStorage",
      `keys=${JSON.stringify(brainKeysAfter)}`);

    // Re-import with cache-buster. ES modules cache by URL; ?v= forces a new
    // module instance. The new instance should re-read state from
    // localStorage.
    let brain2 = null;
    try {
      brain2 = await import("../modules/mascot_brain.js?reimport=" + Date.now());
    } catch (e) {
      assert(false, "re-import mascot_brain.js", String(e && e.message || e));
    }
    if (brain2 && typeof brain2.snapshot === "function") {
      const snap2 = brain2.snapshot();
      const wr2 = snap2 && snap2.bandit_winrates && snap2.bandit_winrates.template;
      // Note: depending on bundler/cache behavior, the re-import may share
      // module state with the first import. We accept either fresh-load OR
      // shared-state; the load-bearing assertion is that 'acted' is still 1.
      assertEq(wr2 && wr2.acted, 1,
        "after re-import, bandit_winrates.template.acted === 1 (persistence)");
    } else {
      assert(false, "re-imported module exposes snapshot()");
    }
  } catch (e) {
    assert(false, "Test 4 threw", String(e && e.message || e));
  }

  // ---------------------------------------------------------------------------
  // Test 5 - Snapshot shape contract
  // ---------------------------------------------------------------------------
  group("Test 5 - Snapshot shape contract");
  try {
    safeReset();
    const snap = brain.snapshot();
    assert(snap && typeof snap === "object", "snapshot() returns an object");

    const expectedKeys = [
      "state_version",
      "hist",
      "hist_top_hours",
      "gaps_minutes",
      "thresholds",
      "bandit_winrates",
      "recent_events",
      "totals",
    ];
    const actualKeys = Object.keys(snap);
    assertArrayEq(actualKeys, expectedKeys,
      "snapshot top-level keys EXACTLY match contract");

    assert(Array.isArray(snap.hist) && snap.hist.length === 24,
      "snapshot.hist.length === 24");
    assert(Array.isArray(snap.hist) && snap.hist.every((v) => typeof v === "number"),
      "snapshot.hist entries are all numbers");

    assert(snap.gaps_minutes && typeof snap.gaps_minutes === "object",
      "snapshot.gaps_minutes is an object");
    assert(snap.gaps_minutes && "p50" in snap.gaps_minutes,
      "snapshot.gaps_minutes.p50 exists");
    assert(snap.gaps_minutes && "p90" in snap.gaps_minutes,
      "snapshot.gaps_minutes.p90 exists");
    assert(snap.gaps_minutes && "samples" in snap.gaps_minutes,
      "snapshot.gaps_minutes.samples exists");

    assert(snap.thresholds && typeof snap.thresholds === "object",
      "snapshot.thresholds is an object");
    assert(snap.thresholds && "sleepy_ms" in snap.thresholds,
      "snapshot.thresholds.sleepy_ms exists");
    assert(snap.thresholds && "bored_ms" in snap.thresholds,
      "snapshot.thresholds.bored_ms exists");

    assert(snap.totals && typeof snap.totals === "object",
      "snapshot.totals is an object");
    assert(snap.totals && "jobs_seen" in snap.totals,
      "snapshot.totals.jobs_seen exists");
    assert(snap.totals && "jobs_done" in snap.totals,
      "snapshot.totals.jobs_done exists");
    assert(snap.totals && "jobs_failed" in snap.totals,
      "snapshot.totals.jobs_failed exists");
  } catch (e) {
    assert(false, "Test 5 threw", String(e && e.message || e));
  }

  // ---------------------------------------------------------------------------
  // Cleanup: wipe brain keys, then restore any pre-existing brain keys we saw
  // before tests started.
  // ---------------------------------------------------------------------------
  clearKeys();
  for (const [k, v] of Object.entries(savedBrainKeys)) {
    realStorage.setItem(k, v);
  }

  // ---------------------------------------------------------------------------
  // Summary
  // ---------------------------------------------------------------------------
  const sumEl = document.getElementById("summary");
  sumEl.textContent = `${pass} PASS / ${fail} FAIL`;
  sumEl.className = "summary " + (fail === 0 ? "pass" : "fail");
</script>
</body>
</html>
